name: CI/CD Pipeline - Test, Lint & Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-lint:
    name: Build, Lint & Automated QA
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ecommerce_test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Code Quality & Linting Check (Ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Generate Deterministic Test Fixtures
        run: |
          python -c "from scripts.prepare_dataset import create_deterministic_fixtures; create_deterministic_fixtures()"

      - name: Run Full Pytest Suite with Coverage (SQLite Baseline)
        run: |
          pytest -v --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      - name: Run Database Integration & SQL Tests (PostgreSQL Container)
        env:
          DATABASE_URL: postgresql+psycopg2://test_user:test_password@localhost:5432/ecommerce_test_db
        run: |
          pytest tests/integration/ -v

      - name: Verify End-to-End ETL Pipeline Execution (PostgreSQL Container)
        env:
          DATABASE_URL: postgresql+psycopg2://test_user:test_password@localhost:5432/ecommerce_test_db
        run: |
          python -m scripts.run_pipeline --input test-data/synthetic_transactions.csv --load-db

      - name: Upload Test Coverage Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14
